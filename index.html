<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ForexSight II</title>
<meta name="description" content="Signals with their evidence attached, and a measured read of what the market is doing.">
<meta name="theme-color" content="#070a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForexSight">
<link rel="manifest" href="/manifest.json?v=610">
<link rel="icon" href="/favicon-32.png?v=610">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=610">
<link rel="stylesheet" href="/v2/base.css?v=3">
</head>
<body>

<header class="top">
  <div class="top-in">
    <span class="dot" id="pulse"></span>
    <span class="brand">ForexSight <span class="ii">base II</span></span>
    <button id="research-btn" class="rs-btn" title="Ask anything about this site or trading">Research</button>
    <span class="top-meta" id="meta">loading</span>
  </div>
</header>

<div class="wrap">

  <section class="cmd" id="command"></section>

  <!-- What the market is talking about. Reserved height so arrival shifts nothing. -->
  <section class="voice" id="voice">
    <div class="voice-label">What the market is doing</div>
    <div class="voice-head skel" style="height:26px;width:72%"></div>
    <div class="voice-reads">
      <div class="vr"></div><div class="vr"></div><div class="vr"></div>
    </div>
  </section>

  <div class="strip" id="context"></div>

  <h2 class="sec">Live signals</h2>
  <div class="cards" id="cards">
    <div class="empty"><strong>Loading</strong>Reading the published feed.</div>
  </div>

  <h2 class="sec">Honest record</h2>
  <div class="record" id="record"></div>

  <h2 class="sec">What has been tested</h2>
  <div id="trials"></div>

  <h2 class="sec">Every signal, judged</h2>
  <div class="hist" id="hist"></div>

  <footer class="foot" id="foot"></footer>
</div>

<script src="/v2/knowledge.js?v=3"></script>
<script src="/v2/commands.js?v=3"></script>
<script src="/v2/base.js?v=3"></script>
</body>
</html>
