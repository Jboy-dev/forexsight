<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>ForexSight — Live Signals</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #0b1220;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 18px 14px 40px;
  }
  h1 {
    font-size: 18px; font-weight: 800; letter-spacing: 0.02em;
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 12px; border-bottom: 1px solid rgba(148,163,184,0.15);
    margin-bottom: 14px;
  }
  .meta { font-size: 11px; opacity: 0.6; font-weight: 500; }
  .status { padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; }
  .status.loading { background: rgba(59,130,246,0.15); color: #93c5fd; }
  .status.empty   { background: rgba(251,191,36,0.15); color: #fcd34d; }
  .status.error   { background: rgba(239,68,68,0.15);  color: #fca5a5; }
  .status.ok      { background: rgba(16,185,129,0.15); color: #6ee7b7; }
  .card {
    background: rgba(15,23,42,0.55);
    border: 1px solid rgba(148,163,184,0.14);
    border-left: 4px solid var(--dir, #94a3b8);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.20);
  }
  .card.buy  { --dir: #22c55e; }
  .card.sell { --dir: #ef4444; }
  .row-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .pair  { font-size: 17px; font-weight: 900; letter-spacing: 0.03em; }
  .dir   { padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; }
  .dir.buy  { background: rgba(34,197,94,0.20); color: #4ade80; }
  .dir.sell { background: rgba(239,68,68,0.20); color: #f87171; }
  .tier  {
    padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    background: rgba(148,163,184,0.15); color: #94a3b8;
  }
  .tier.best, .tier.platinum, .tier.premium { background: rgba(251,191,36,0.20); color: #fcd34d; }
  .conf  { margin-left: auto; font-size: 13px; font-weight: 700; color: #cbd5e1; font-variant-numeric: tabular-nums; }
  .levels {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 8px 14px; margin-top: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }
  .lvl-label { opacity: 0.55; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; }
  .lvl-val   { font-weight: 700; font-size: 13.5px; color: #f1f5f9; }
  .meta-strip { margin-top: 8px; font-size: 11px; opacity: 0.65; }
  .reason { margin-top: 8px; font-size: 12px; line-height: 1.5; padding: 8px 10px; background: rgba(255,255,255,0.03); border-radius: 6px; }
  .refresh-btn {
    background: linear-gradient(180deg, rgba(59,130,246,0.20) 0%, rgba(59,130,246,0.08) 100%);
    border: 1px solid rgba(59,130,246,0.30);
    color: #93c5fd; padding: 6px 14px; border-radius: 8px;
    font-size: 12px; font-weight: 700; cursor: pointer; letter-spacing: 0.03em;
  }
  .refresh-btn:active { transform: scale(0.97); }
  .footer { margin-top: 22px; text-align: center; font-size: 11px; opacity: 0.45; }
  .footer a { color: #93c5fd; text-decoration: none; }
</style>
</head>
<body>
  <h1>
    <span>ForexSight — Live Signals</span>
    <span class="meta" id="meta">loading…</span>
  </h1>
  <div id="status" class="status loading">Loading current signals from server…</div>
  <div style="margin-bottom: 12px; display: flex; gap: 8px; align-items: center;">
    <button class="refresh-btn" onclick="load()">🔄 Refresh</button>
    <span class="meta">auto-refresh every 60s</span>
  </div>
  <div id="signals"></div>
  <div class="footer">
    Standalone signal view · no service-worker cache ·
    <a href="/">back to full app</a> ·
    <a href="/api/state-audit" target="_blank">state audit</a>
  </div>

<script>
const meta = document.getElementById('meta');
const status = document.getElementById('status');
const list = document.getElementById('signals');

function pipMult(pair) {
  if (pair === 'XAU/USD') return 10;
  if (pair === 'BTC/USD') return 1;
  if (pair === 'ETH/USD') return 10;
  if (['US30','NAS100','SPX500'].includes(pair)) return 1;
  if (pair && pair.includes('JPY')) return 100;
  return 10000;
}
function pips(a, b, pair) {
  if (a == null || b == null) return '?';
  return Math.round(Math.abs(a - b) * pipMult(pair));
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function render(sigs) {
  list.innerHTML = sigs.map(s => {
    const dir = String(s.direction || '').toLowerCase();
    const tier = String(s.tier || '').toLowerCase();
    const slp = pips(s.entry, s.sl, s.pair);
    const tp1p = pips(s.entry, s.tp1, s.pair);
    const tp3p = pips(s.entry, s.tp3, s.pair);
    return `
      <div class="card ${esc(dir)}">
        <div class="row-head">
          <span class="pair">${esc(s.pair)}</span>
          <span class="dir ${esc(dir)}">${esc(s.direction)}</span>
          <span class="tier ${esc(tier)}">${esc(s.tier || 'signal')}</span>
          <span class="conf">${esc(s.confidence)}%</span>
        </div>
        <div class="levels">
          <div><div class="lvl-label">Entry</div><div class="lvl-val">${esc(s.entry)}</div></div>
          <div><div class="lvl-label">Stop (-${slp}p)</div><div class="lvl-val">${esc(s.sl)}</div></div>
          <div><div class="lvl-label">TP1 (+${tp1p}p)</div><div class="lvl-val">${esc(s.tp1)}</div></div>
          <div><div class="lvl-label">TP3 (+${tp3p}p)</div><div class="lvl-val">${esc(s.tp3)}</div></div>
        </div>
        <div class="meta-strip">
          Strategies: ${esc(s.strategies ?? '?')} · R:R ${esc(s.rMultiple ?? '?')}${s.namedStrategies?.length ? ' · ' + esc(s.namedStrategies.join(', ')) : ''}
        </div>
        ${s.reasoning ? `<div class="reason">${esc(String(s.reasoning).slice(0, 400))}</div>` : ''}
      </div>
    `;
  }).join('');
}
async function load() {
  status.className = 'status loading';
  status.textContent = 'Loading current signals…';
  try {
    const r = await fetch('/api/latest-signals?_t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const sigs = Array.isArray(d.signals) ? d.signals : [];
    const ageS = d.ts ? Math.round((Date.now() - d.ts) / 1000) : null;
    meta.textContent = ageS != null ? `age ${ageS}s · ${sigs.length} signal${sigs.length===1?'':'s'}` : `${sigs.length} signals`;
    if (sigs.length === 0) {
      status.className = 'status empty';
      status.textContent = 'No signals firing right now — market may be quiet or filters strict.';
      list.innerHTML = '';
      return;
    }
    status.className = 'status ok';
    status.textContent = '✓ ' + sigs.length + ' live signal' + (sigs.length===1?'':'s') + ' · updated ' + ageS + 's ago';
    render(sigs);
  } catch (e) {
    status.className = 'status error';
    status.textContent = 'Error: ' + e.message;
    meta.textContent = 'error';
  }
}
load();
setInterval(load, 60000);
fetch('/api/check-signals').catch(() => {});
</script>
</body>
</html>
