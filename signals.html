<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ForexSight — Live Signals</title>
<style>
  :root {
    --bg: #000;
    --panel: #15161a;
    --panel-2: #1c1d22;
    --text: #f5f5f7;
    --muted: #86868b;
    --buy: #30d158;
    --sell: #ff453a;
    --accent: #0a84ff;
    --border: rgba(255,255,255,0.10);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 16px;
    min-height: 100vh;
  }
  header {
    text-align: center;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    background: linear-gradient(135deg, #0a84ff, #30d158);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 12px;
  }
  .status {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .refresh-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-left: 8px;
  }
  .signal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .sig-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .pair {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .dir {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    padding: 4px 10px;
    border-radius: 5px;
  }
  .dir-BUY {
    background: rgba(48,209,88,0.15);
    color: var(--buy);
    border: 1px solid rgba(48,209,88,0.45);
  }
  .dir-SELL {
    background: rgba(255,69,58,0.15);
    color: var(--sell);
    border: 1px solid rgba(255,69,58,0.45);
  }
  .strats {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-left: auto;
  }
  .strat {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(10,132,255,0.18);
    border: 1px solid rgba(10,132,255,0.40);
    color: #87cefa;
    letter-spacing: 0.4px;
  }
  .levels {
    display: grid;
    grid-template-columns: 60px 1fr 80px;
    gap: 4px 10px;
    font-size: 13px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .lbl {
    color: var(--muted);
  }
  .val {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
    text-align: right;
    font-weight: 600;
  }
  .lbl.entry { color: var(--accent); font-weight: 600; }
  .lbl.sl { color: var(--sell); font-weight: 600; }
  .lbl.tp { color: var(--buy); font-weight: 600; }
  .rr {
    color: var(--muted);
    font-size: 11px;
    text-align: right;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>
<header>
  <h1>⚡ Live Signals</h1>
  <p class="sub">Direct strategy detection · No app cache · Updates every 30s</p>
</header>

<div class="status" id="status">Loading…</div>
<div id="signals"></div>

<script>
async function load() {
  const status = document.getElementById('status');
  const out = document.getElementById('signals');
  try {
    status.textContent = 'Scanning all 32 instruments…';
    const r = await fetch('/api/diagnose', { cache: 'no-store' });
    const d = await r.json();
    status.innerHTML = `<strong>${d.signals_firing}</strong> signals firing of ${d.instruments_scanned} instruments · ${new Date(d.ts).toLocaleTimeString()} <button class="refresh-btn" onclick="load()">↻ Refresh</button>`;
    if (!d.signals.length) {
      out.innerHTML = '<div class="empty">No signals firing right now. Strategies are watching. Refresh in a minute.</div>';
      return;
    }
    out.innerHTML = d.signals.map(s => `
      <div class="signal">
        <div class="sig-head">
          <span class="pair">${s.pair}</span>
          <span class="dir dir-${s.direction}">${s.direction}</span>
          <span class="strats">${s.strategies.map(x => `<span class="strat">${x}</span>`).join('')}</span>
        </div>
        <div class="levels">
          <span class="lbl entry">Entry</span><span class="val">${s.entry}</span><span class="rr"></span>
          <span class="lbl sl">SL</span><span class="val">${s.sl}</span><span class="rr">${s.risk_pips} pips risk</span>
          <span class="lbl tp">TP1</span><span class="val">${s.tp1}</span><span class="rr">R:R 1:1</span>
          <span class="lbl tp">TP2</span><span class="val">${s.tp2}</span><span class="rr">R:R 1:2</span>
          <span class="lbl tp">TP3</span><span class="val">${s.tp3}</span><span class="rr">R:R 1:3</span>
        </div>
      </div>
    `).join('');
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
