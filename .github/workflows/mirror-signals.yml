name: Mirror signals to git

# v428 — Signal mirror, hardened.
#
# Every 15 min, fetch each endpoint from whichever Cloudflare deployment
# is currently healthy and commit the JSON to /data/*.json. Cloudflare
# Pages serves those as STATIC assets (unlimited quota), so the app keeps
# working even when Pages Functions are fully quota-exhausted.
#
# v428 fixes over v426:
#   • Per-endpoint failover. v426 broke out of the URL loop as soon as
#     data/latest-signals.json existed on disk — even when that file was
#     a stale leftover from a previous run and THIS run had fetched
#     nothing. Endpoints like algo-read / setup-radar therefore never got
#     a mirror file at all. Now every endpoint independently tries every
#     base URL until one returns real JSON.
#   • Freshness guard. A response is only written if it parses as JSON
#     AND is larger than a trivial error blob.
#   • Cadence 30m → 15m (still ~3 min of Actions time/day, far inside
#     the 2000 min/month free tier).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  # v462 — shared with watch-offset.yml so the two watchers interleave
  # instead of writing the same files at the same moment.
  group: market-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch each endpoint from whichever URL is healthy
        run: |
          set +e
          mkdir -p data
          # v447 — ORDER MATTERS, AND IT WAS WRONG.
          #
          # forexsight-justice was first, so it won every race — and it still
          # runs v365, about eighty versions behind. The app has therefore
          # been showing its output, which included a USD/CHF signal whose
          # entry equalled its stop (zero risk, untradeable) and three
          # "chart-read" tier signals that v413 banned from the feed as a 71%
          # loser. Its FX prices were rounded to 2dp on 5dp pairs (the v401
          # bug, fixed here, still live there).
          #
          # preview runs current code, so it goes first. justice stays as a
          # backstop, but nothing from either is trusted without passing
          # tools/validate-signals.mjs below.
          BASES="https://forexsight-preview.pages.dev https://forexsight-justice.pages.dev"
          ENDPOINTS="latest-signals shadow-tracker self-trust conditions-score algo-read setup-radar"
          OK_COUNT=0
          FAIL_LIST=""

          for ep in $ENDPOINTS; do
            GOT=0
            for BASE in $BASES; do
              body=$(curl -sS --max-time 20 "$BASE/api/$ep" 2>/dev/null)
              [ -z "$body" ] && continue
              first=$(printf %.1s "$body")
              # Must look like JSON, not the SPA's index.html fallback
              [ "$first" != "{" ] && [ "$first" != "[" ] && continue
              # Must actually parse
              echo "$body" | python3 -c "import json,sys; json.load(sys.stdin)" 2>/dev/null || continue
              # Must be non-trivial (an error blob is usually < 100 bytes)
              size=$(printf %s "$body" | wc -c)
              [ "$size" -lt 60 ] && continue
              # v447 — signals must also be TRADEABLE, not merely well-formed
              # JSON. An old deployment served entry==sl (zero risk) and
              # banned chart-read tiers, and the mirror copied it verbatim.
              if [ "$ep" = "latest-signals" ]; then
                printf '%s' "$body" > /tmp/candidate.json
                if ! node tools/validate-signals.mjs /tmp/candidate.json; then
                  echo "  ⚠ ${ep} from ${BASE} failed validation — trying next source"
                  continue
                fi
              fi
              printf '%s' "$body" > "data/${ep}.json"
              echo "  ✓ ${ep}.json  ${size}b  from ${BASE}"
              GOT=1
              OK_COUNT=$((OK_COUNT+1))
              break
            done
            if [ "$GOT" = "0" ]; then
              echo "  ✗ ${ep}: no healthy source this run (keeping previous file if any)"
              FAIL_LIST="$FAIL_LIST $ep"
            fi
          done

          cat > data/_mirror-meta.json <<EOF
          {
            "mirroredAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "source": "github-actions-mirror",
            "endpointsRefreshed": ${OK_COUNT},
            "endpointsFailed": "${FAIL_LIST}"
          }
          EOF

          echo ""
          echo "refreshed ${OK_COUNT} endpoint(s) this run"
          echo "MIRROR_OK=${OK_COUNT}" >> $GITHUB_ENV
          if [ -n "$(echo "$FAIL_LIST" | tr -d ' ' | grep -o 'latest-signals' || true)" ]; then
            echo "SIGNALS_STALE=1" >> $GITHUB_ENV
          fi
          ls -la data/

      # v447 — STANDBY GENERATOR.
      #
      # The steps above mirror Cloudflare's output, so when Functions are
      # quota-exhausted they have nothing to copy and the mirror silently
      # freezes at its last good snapshot. On the day this was added it was
      # serving signals seven hours old.
      #
      # This step runs the real engine here instead — same strictAnalyze()
      # imported from check-signals.js, fed by Yahoo bars — so the app has
      # current signals regardless of Cloudflare's state. It only runs when
      # the live mirror failed, so a healthy deployment always wins.
      - name: Generate signals locally (no healthy, valid source)
        if: env.SIGNALS_STALE == '1'
        run: |
          echo "no deployment returned valid signals — running the engine here instead"
          node tools/generate-signals.mjs
          python3 -c "
          import json
          d = json.load(open('data/latest-signals.json'))
          print(f\"  generated {d['count']} signals at {d['isoTime']}\")
          for s in d['signals'][:5]:
              print(f\"    {s['pair']} {s['direction']} entry={s['entry']} sl={s['sl']} tp1={s['tp1']}\")
          "

      # v454 — PUBLISH REAL CANDLES AS STATIC ASSETS.
      #
      # The trade monitor needs a trade's full high/low history to know
      # whether a stop or target was touched while the app was closed. With
      # Functions down it otherwise saw only prices since the tab opened,
      # which made winners that resolved overnight get written down as losses.
      - name: Publish OHLC bars for the client
        run: node tools/publish-ohlc.mjs

      # v448 — WATCH THE SETUPS, ALWAYS.
      #
      # The outcome watcher (shadow-tracker) is a Cloudflare Function, so
      # when the Function budget runs out nothing follows the setups that
      # were already published. The feed then shows open trades that nobody
      # is tracking, which is worse than showing none — it looks like it is
      # watching when it is not.
      #
      # This runs unconditionally, not just on failover, so there is always
      # one record that is complete. It re-walks every open setup from the
      # bar it fired on, so GitHub throttling this cron to ~hourly (measured
      # 46-72 min against the requested 15) delays publication without ever
      # changing an outcome.
      - name: Watch open setups
        run: node tools/watch-setups.mjs

      # v463 — SELF-EVALUATION, WITH THE POWER TO FIND NOTHING.
      #
      # Runs after the watcher so it always scores the freshest resolved
      # setups. It reports every slice with a bootstrap interval and only
      # marks a finding actionable if it clears zero AND still clears zero
      # on the recent half of the data. Five previous "learning" passes on
      # this project found patterns that vanished on new data; the time
      # split is what stops a sixth. When nothing qualifies it says so and
      # the engine is left alone.
      - name: Self-evaluate
        run: node tools/self-evaluate.mjs

      - name: Commit + push if changed
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "signals-mirror-bot"
          git config user.email "actions@github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: mirror signals snapshot $(date -u +%H:%M)"
            # Retry push once — concurrent runs can race
            git push || (git pull --rebase && git push)
            echo "✔ pushed mirror snapshot"
          else
            echo "→ no changes to commit"
          fi
