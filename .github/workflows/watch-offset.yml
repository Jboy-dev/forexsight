name: Market watch (offset)

# v462 — SECOND WATCHER, OFFSET FROM THE FIRST.
#
# GitHub throttles a repo's scheduled workflows. mirror-signals.yml asks for
# every 15 minutes and actually lands roughly hourly (measured 46-72 min
# between runs), which is how long a setup could sit unseen.
#
# Throttling is applied per workflow, so a second workflow on an offset
# schedule roughly halves that worst-case gap. It runs the same steps and is
# safe to overlap: signal generation is deterministic, the watcher re-walks
# every setup from the bar it fired on rather than from "since last run", and
# the commit step is a no-op when nothing changed.

on:
  schedule:
    # Offset from the primary so the two interleave rather than collide.
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  # Shared with the primary: if one is mid-run the other stands down instead
  # of racing it to the same files.
  group: market-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Refresh candles
        run: node tools/publish-ohlc.mjs

      - name: Generate signals
        run: |
          node tools/generate-signals.mjs
          node tools/validate-signals.mjs data/latest-signals.json

      # v465 — verify the candles the engine reads before trusting anything
      # computed from them. A stale, spliced or malformed bar produces a
      # confident wrong answer, which is worse than no answer.
      - name: Verify chart data

      # v491 — the proven strategies previously lived only in the standby
      # generator, which runs solely when Cloudflare fails. With Cloudflare
      # healthy the mirror took its output and the backtested rules never ran
      # at all. This merges them in unconditionally, appending to whatever the
      # mirror obtained rather than replacing it.
      - name: Merge proven-strategy signals
        run: node tools/merge-proven.mjs

        run: node tools/verify-data.mjs

      # v475 — Ask an unrelated provider what the price is. verify-data proves
      # the bars are internally consistent; a single source that is confidently
      # wrong passes that and produces a clean-looking bad signal.
      - name: Verify prices against independent sources
        run: node tools/verify-prices.mjs

      - name: Watch open setups
        run: node tools/watch-setups.mjs

      # v463 — SELF-EVALUATION, WITH THE POWER TO FIND NOTHING.
      #
      # Runs after the watcher so it always scores the freshest resolved
      # setups. It reports every slice with a bootstrap interval and only
      # marks a finding actionable if it clears zero AND still clears zero
      # on the recent half of the data. Five previous "learning" passes on
      # this project found patterns that vanished on new data; the time
      # split is what stops a sixth. When nothing qualifies it says so and
      # the engine is left alone.
      # v464 — Recover attribution the watcher used to drop. Idempotent: it
      # only fills blanks, so once history is backfilled this is a no-op that
      # still catches any future gap.
      # v469 — Build the learning brain here, not in Cloudflare. It used to be
      # written by a Function into KV with a 14-day TTL; the key expired, the
      # namespace emptied, and every signal started arriving unscored. Built in
      # CI from the tracked book it costs no invocations, uses no KV, and
      # cannot expire.
      - name: Build learning brain
        run: node tools/build-brain.mjs

      - name: Backfill attribution
        run: node tools/backfill-attribution.mjs

      # v485 — walk-forward backtest of the real engine, no lookahead, real
      # managed ladder, episodes not publications. Kept current so the claim on
      # the site is always a measurement rather than a memory.
      # v487 — re-test the published strategies on fresh data so the evidence
      # on the cards stays a current measurement rather than a stored claim.
      # v489 — the corpus the control and lab read is gitignored (14MB, and
      # re-fetchable), so CI had nothing to read and both steps exited early.
      # The `|| true` on them turned that into silence, which meant the guard
      # that is supposed to withdraw the strategy claim was never running at
      # all. Fetch it first; the fetcher exits non-zero if too little arrives.
      - name: Fetch backtest history
        run: node tools/fetch-history.mjs

      # v488 — the control runs FIRST. It replaces the strategy with random
      # entries on the same bars through the same simulator; if those score
      # anything but about zero, the number is coming from the ladder and the
      # strategy claim must not be shown. No `|| true`: a control that fails
      # quietly is the same as no control.
      - name: Control test (must fail to prove the edge)
        run: node tools/control-test.mjs

      - name: Strategy lab
        run: node tools/strategy-lab.mjs

      - name: Backtest the engine
        run: BT_STEP=3 node tools/backtest-engine.mjs

      - name: Self-evaluate
        run: node tools/self-evaluate.mjs

      - name: Commit if changed
        run: |
          git config user.name "market-watch-bot"
          git config user.email "actions@github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: market watch $(date -u +%H:%M)"
            git push || (git pull --rebase && git push)
          else
            echo "no change"
          fi
