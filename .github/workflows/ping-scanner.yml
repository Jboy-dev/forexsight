name: Preview scanner heartbeat

# v425 — Dual-URL scanner: keeps BOTH preview + justice URLs warm.
# Tolerates non-JSON responses so a Cloudflare Functions outage on one
# URL doesn't fail the whole run. Every 30 min while inside private-repo
# free tier (2000 min/month), well within budget.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: preview-scanner
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fire scan chain against BOTH URLs
        run: |
          set +e
          for BASE in "https://forexsight-preview.pages.dev" "https://forexsight-justice.pages.dev"; do
            echo "▶ ${BASE}"
            # v434 — trimmed to the two endpoints that actually advance state.
            # check-signals already fans out to shadow-tracker, self-trust,
            # chart-eye and the rest internally, so pinging them separately
            # re-ran the same cascade several times per run. tp-monitor is
            # kept because nothing else triggers TP/SL resolution.
            curl -sS -o /dev/null -w "  check-signals   %{http_code} %{time_total}s\n" "$BASE/api/check-signals" &
            curl -sS -o /dev/null -w "  tp-monitor      %{http_code} %{time_total}s\n" "$BASE/api/tp-monitor" &
            wait
          done
          echo "✔ chain complete"

      - name: Verify state (tolerant of non-JSON)
        run: |
          set +e
          for BASE in "https://forexsight-preview.pages.dev" "https://forexsight-justice.pages.dev"; do
            echo "▶ ${BASE} state:"
            body=$(curl -sS "$BASE/api/state-audit" 2>/dev/null)
            if [ -z "$body" ]; then
              echo "  ✗ empty response (endpoint may not exist on this URL)"
              continue
            fi
            first=$(echo "$body" | head -c 1)
            if [ "$first" != "{" ] && [ "$first" != "[" ]; then
              echo "  ✗ non-JSON response (Functions may be down / endpoint missing)"
              continue
            fi
            echo "$body" | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              print(f\"  overall: {d.get('overall','?')} — {d.get('summary','?')}\")
          except Exception as e:
              print(f'  ✗ parse error: {e}')
          " || true
          done
          # Never fail the run — cron should not fail just because one URL is down
          exit 0
