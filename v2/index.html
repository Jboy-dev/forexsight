<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ForexSight II</title>
<meta name="description" content="Signals with their evidence attached, and a measured read of what the market is doing.">
<meta name="theme-color" content="#070a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ForexSight">
<link rel="stylesheet" href="/v2/base.css?v=3">
</head>
<body>

<header class="top">
  <div class="top-in">
    <span class="dot" id="pulse"></span>
    <span class="brand">ForexSight <span class="ii">base II</span></span>
    <button id="research-btn" class="rs-btn" title="Ask anything about this site or trading">Research</button>
    <span class="top-meta" id="meta">loading</span>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <div class="tabs-in" id="tabs-in">
      <button class="tab" data-tab="signals" data-roid="signals" role="tab">Signals <span class="tab-n" id="tab-n-signals"></span></button>
      <button class="tab" data-tab="market"  data-roid="market"  role="tab">Market</button>
      <button class="tab" data-tab="calc"    data-roid="calc"    role="tab">Calculator</button>
      <button class="tab" data-tab="ledger"  data-roid="ledger"  role="tab">Ledger <span class="tab-n" id="tab-n-ledger"></span></button>
      <button class="tab" data-tab="tested"  data-roid="tested"  role="tab">Tested</button>
    </div>
  </nav>
</header>

<div class="wrap">

  <section class="cmd" id="command"></section>

  <!-- ── SIGNALS ─────────────────────────────────────────────────────── -->
  <section class="pane" data-pane="signals">
    <div class="segs" data-segs="signals">
      <section class="seg" data-roid="cards">
        <h2 class="sec"><span class="seg-grip" title="Press and hold for 2 seconds, then drag to rearrange">⠿</span>Live signals</h2>
        <div class="cards" id="cards">
          <div class="empty"><strong>Loading</strong>Reading the published feed.</div>
        </div>
      </section>
    </div>
  </section>

  <!-- ── MARKET ──────────────────────────────────────────────────────── -->
  <section class="pane" data-pane="market">
    <div class="segs" data-segs="market">
      <section class="seg" data-roid="voice">
        <h2 class="sec"><span class="seg-grip" title="Press and hold for 2 seconds, then drag to rearrange">⠿</span>What the market is doing</h2>
        <div class="voice" id="voice">
          <div class="voice-label">What the market is doing</div>
          <div class="voice-head skel" style="height:26px;width:72%"></div>
          <div class="voice-reads"><div class="vr"></div><div class="vr"></div><div class="vr"></div></div>
        </div>
      </section>
      <section class="seg" data-roid="context">
        <h2 class="sec"><span class="seg-grip" title="Press and hold for 2 seconds, then drag to rearrange">⠿</span>Conditions</h2>
        <div class="strip" id="context"></div>
      </section>
    </div>
  </section>

  <!-- ── CALCULATOR ──────────────────────────────────────────────────── -->
  <section class="pane" data-pane="calc">
    <div class="segs" data-segs="calc">
      <section class="seg" data-roid="calc">
        <h2 class="sec"><span class="seg-grip" title="Press and hold for 2 seconds, then drag to rearrange">⠿</span>Calculator</h2>
        <div id="calc"></div>
      </section>
    </div>
  </section>

  <!-- ── LEDGER ──────────────────────────────────────────────────────── -->
  <section class="pane" data-pane="ledger">
    <div class="segs" data-segs="ledger">
      <section class="seg" data-roid="ledger">
        <h2 class="sec"><span class="seg-grip" title="Press and hold for 2 seconds, then drag to rearrange">⠿</span>Signal ledger</h2>
        <div id="ledger"></div>
      </section>
      <section class="seg" data-roid="record">
        <h2 class="sec"><span class="seg-grip" title="Press and hold for 2 seconds, then drag to rearrange">⠿</span>Honest record</h2>
        <div class="record" id="record"></div>
      </section>
      <section class="seg" data-roid="hist">
        <h2 class="sec"><span class="seg-grip" title="Press and hold for 2 seconds, then drag to rearrange">⠿</span>Every signal, judged</h2>
        <div class="hist" id="hist"></div>
      </section>
    </div>
  </section>

  <!-- ── TESTED ──────────────────────────────────────────────────────── -->
  <section class="pane" data-pane="tested">
    <div class="segs" data-segs="tested">
      <section class="seg" data-roid="trials">
        <h2 class="sec"><span class="seg-grip" title="Press and hold for 2 seconds, then drag to rearrange">⠿</span>What has been tested</h2>
        <div id="trials"></div>
      </section>
    </div>
  </section>

  <footer class="foot" id="foot"></footer>
</div>

<script src="/v2/reorder.js?v=8"></script>
<script src="/v2/chart.js?v=8"></script>
<script src="/v2/resolve.js?v=8"></script>
<script src="/v2/knowledge.js?v=8"></script>
<script src="/v2/calc.js?v=8"></script>
<script src="/v2/commands.js?v=8"></script>
<script src="/v2/base.js?v=8"></script>
<script>
// Register the service worker. Base II shipped without this: the promotion
// moved the page but left registration behind in the old shell, so the
// installed app had no worker at all — no offline shell, and no route for an
// update to reach the phone.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
      .then(function (r) { r.update().catch(function () {}); })
      .catch(function (e) { console.warn('[sw] registration failed', e && e.message); });
  });
}
</script>
</body>
</html>
